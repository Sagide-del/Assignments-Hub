name: Deploy frontend to AWS
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/career/**'
      - 'backend/src/__tests__/matcher.spec.ts'
      - 'backend/src/analytics/**'
      - 'backend/src/__tests__/acquisition.spec.ts'
      - 'backend/src/kjsea/**'
      - 'backend/src/cms/**'
      - 'backend/src/sba/**'
      - 'backend/src/csl/**'
      - 'backend/src/study-hub/**'
      - 'backend/src/student/**'
      - 'backend/src/users/**'
      - 'backend/src/__tests__/assignments.spec.ts'
      - 'backend/src/math-engine/**'
      - 'backend/scripts/prepare-math-engine.mjs'
      - 'backend/runtime/math-engine/**'
      - 'backend/src/__tests__/math-engine.spec.ts'
      - 'services/math-engine/**'
      - 'backend/src/__tests__/filtering.spec.ts'
      - 'backend/src/__tests__/content-delivery-phase1.spec.ts'
      - 'backend/src/__tests__/student-library.spec.ts'
      - 'backend/src/__tests__/timetable.spec.ts'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/__tests__/csl.spec.ts'
      - 'backend/src/__tests__/sba.spec.ts'
      - 'backend/src/__tests__/sba-import.spec.ts'
      - 'backend/src/__tests__/exam.spec.ts'
      - 'backend/src/submissions/**'
      - 'backend/src/teacher-scope/**'
      - 'backend/scripts/deployment/**'
      - 'backend/src/__tests__/rbac.spec.ts'
      - 'backend/src/labs/**'
      - 'backend/src/ai-content/**'
      - 'backend/src/ai/**'
      - 'backend/src/independent-students/**'
      - 'backend/src/payment/**'
      - 'backend/src/auth/**'
      - 'backend/src/lab-sessions/**'
      - 'backend/src/question-bank/**'
      - 'backend/src/mnemonic-cards/**'
      - 'backend/prisma/schema.prisma'
      - 'backend/prisma/migrations/**'
      - 'scripts/deployment/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-frontend
  cancel-in-progress: false
jobs:
  deploy:
    # Playwright 1.56.1 supports Noble; avoid ubuntu-latest moving to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rbac_test
          POSTGRES_PASSWORD: rbac_test_local_only
          POSTGRES_DB: rbac_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rbac_test -d rbac_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Test verified publish and rollback
        run: node --test scripts/deployment/frontend-snapshot.test.mjs scripts/deployment/public-routes.test.mjs scripts/deployment/publish-verified-rbac.test.mjs backend/scripts/deployment/provision-demo-academy.test.mjs backend/scripts/deployment/prepare-deployment-runtime.test.mjs
      - name: Test public routing and cache configuration
        run: python3 -m unittest discover -s scripts/deployment -p frontend_edge_test.py -v
      - name: Check live RBAC verification configuration
        env:
          DEMO_TEACHER_PASSWORD: ${{ secrets.RBAC_DEMO_TEACHER_PASSWORD }}
          RBAC_ALICE_ID: ${{ vars.RBAC_DEMO_ALICE_ID }}
        run: |
          test -n "$DEMO_TEACHER_PASSWORD" || { echo 'Configure RBAC_DEMO_TEACHER_PASSWORD securely before publishing.' >&2; exit 1; }
          test -n "$RBAC_ALICE_ID" || { echo 'Configure RBAC_DEMO_ALICE_ID from the provisioning report before publishing.' >&2; exit 1; }
      - name: Verify learning activities
        run: npm run test:static-seo && npm run test:math-readiness && npm run test:library && npm run test:cheatsheet && npm run test:student-scope && npm run test:exam-diagrams && npm run test:cms && npm run test:kjsea && npm run test:curriculum && npm run test:stem && npm run test:skills && npm run test:recall && npm run test:assignments && npm run test:revision
        working-directory: frontend
      - name: Type check frontend
        run: npx tsc -b
        working-directory: frontend
      - name: Wait for reviewed public revision export
        run: node scripts/wait-public-revision.mjs
        working-directory: frontend
        env:
          PUBLIC_REVISION_FEED_URL: https://assignments-hub-api.onrender.com/api/v1/cms/public-revision
      - name: Build static frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://assignments-hub-api.onrender.com/api/v1
          PUBLIC_REVISION_FEED_URL: https://assignments-hub-api.onrender.com/api/v1/cms/public-revision
      - name: Verify generated static SEO documents
        working-directory: frontend
        run: node scripts/check-static-seo.mjs dist
      - name: Save frontend build for deployment recovery
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python math engine
        run: |
          python -m venv backend/.math-venv
          backend/.math-venv/bin/pip install -r services/math-engine/requirements-dev.txt
          cd services/math-engine
          ../../backend/.math-venv/bin/python -m unittest -f -v test_engine.py
      - name: Verify assessment backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://schema_check:unused@127.0.0.1:5432/schema_check
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm ci && npx prisma validate && npm test -- --runInBand src/cms src/kjsea src/submissions src/lab-sessions src/question-bank src/mnemonic-cards src/teacher-scope src/assignments src/reports src/sba src/__tests__/exam.spec.ts src/__tests__/sba.spec.ts src/__tests__/sba-import.spec.ts src/__tests__/csl.spec.ts src/__tests__/timetable.spec.ts src/__tests__/filtering.spec.ts src/__tests__/content-delivery-phase1.spec.ts && npm test -- --runInBand src/ai-content src/ai/openai.service.spec.ts src/ai/ai-provider-router.service.spec.ts && npm test -- --runInBand src/independent-students src/payment src/auth && npm run build
      - name: Verify teacher data isolation against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rbac_test:rbac_test_local_only@127.0.0.1:5432/rbac_test
          RBAC_TEST_DATABASE_URL: postgresql://rbac_test:rbac_test_local_only@127.0.0.1:5432/rbac_test
          CMS_TEST_DATABASE_URL: postgresql://rbac_test:rbac_test_local_only@127.0.0.1:5432/cms_publish_test
          MATH_ENGINE_TEST_PYTHON: ${{ github.workspace }}/backend/.math-venv/bin/python
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          npx prisma db push --skip-generate
          docker exec "$TEST_POSTGRES_CONTAINER" psql -U rbac_test -d postgres -c 'CREATE DATABASE cms_publish_test'
          DATABASE_URL="$CMS_TEST_DATABASE_URL" npx prisma migrate deploy
          npm test -- --runInBand
      - name: Wait for CMS distributions and migrated storage
        working-directory: frontend
        run: node scripts/check-cms-distributions.mjs
      - name: Wait for student elective assignment filtering
        working-directory: frontend
        run: node scripts/check-electives-api.mjs
      - name: Wait for Python math engine
        working-directory: frontend
        run: node scripts/check-math-api.mjs
      - name: Wait for student library API
        working-directory: frontend
        run: node scripts/check-library-api.mjs
      - name: Wait for Phase 1 cheat sheets and rotation migration
        working-directory: frontend
        run: node scripts/check-rotation-api.mjs
      - name: Wait for student content filtering API
        working-directory: frontend
        run: node scripts/check-student-filtering-api.mjs
      - name: Wait for weekly study timetable API and schema
        working-directory: frontend
        run: node scripts/check-timetable-api.mjs
      - name: Wait for CSL logbook API and photo storage
        working-directory: frontend
        run: node scripts/check-csl-api.mjs
      - name: Wait for SBA and SVG blueprint schema
        working-directory: frontend
        run: node scripts/check-sba-api.mjs
      - name: Wait for teacher scope API and migration
        working-directory: frontend
        run: node scripts/check-teacher-api.mjs
      - name: Wait for assessment API capabilities
        working-directory: frontend
        run: node scripts/check-kjsea-api.mjs
      - name: Wait for immersive lab API and catalogue
        working-directory: frontend
        run: node scripts/check-stem-api.mjs
      - name: Wait for curriculum library API
        working-directory: frontend
        run: node scripts/check-curriculum-api.mjs
      - name: Wait for Tuma payment API and migration
        working-directory: frontend
        run: node scripts/check-tuma-api.mjs
      - name: Wait for username registration API
        working-directory: frontend
        run: node scripts/check-auth-api.mjs
      - name: Wait for central content library
        working-directory: frontend
        run: node scripts/check-content-api.mjs
      - name: Wait for dynamic lab router storage
        working-directory: frontend
        run: node scripts/check-lab-router-api.mjs

      - name: Wait for Grade 10 guide storage
        working-directory: frontend
        run: node scripts/check-grade10-api.mjs
      - name: Wait for first-party journey tracking
        working-directory: frontend
        run: node scripts/check-acquisition-api.mjs
      - name: Install live verification browser
        run: |
          npm install --prefix "$RUNNER_TEMP/rbac-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/rbac-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/rbac-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify unified login and registration flow
        working-directory: frontend
        env:
          AUTH_UI_BASE_URL: http://127.0.0.1:4196
          AUTH_UI_ARTIFACT_DIR: ${{ runner.temp }}/auth-ui
        run: |
          npm run preview -- --host 127.0.0.1 --port 4196 > "$RUNNER_TEMP/auth-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node scripts/auth-ui.browser.cjs
          node scripts/homepage.browser.cjs
          node scripts/public-revision.browser.cjs
          node scripts/lab-router.browser.cjs
          node scripts/grade10-guide.browser.cjs
          node scripts/static-seo.browser.cjs
      - name: Verify live SBA import access restrictions
        working-directory: frontend
        run: node scripts/check-sba-import-access.mjs
        env:
          DEMO_TEACHER_PASSWORD: ${{ secrets.RBAC_DEMO_TEACHER_PASSWORD }}
          RBAC_ALICE_ID: ${{ vars.RBAC_DEMO_ALICE_ID }}
      - name: Verify live student content scope restrictions
        working-directory: frontend
        run: node scripts/check-student-filtering-access.mjs
        env:
          DEMO_TEACHER_PASSWORD: ${{ secrets.RBAC_DEMO_TEACHER_PASSWORD }}
      - name: Verify live timetable access restrictions
        working-directory: frontend
        run: node scripts/check-timetable-access.mjs
        env:
          DEMO_TEACHER_PASSWORD: ${{ secrets.RBAC_DEMO_TEACHER_PASSWORD }}
      - name: Verify live CSL access restrictions
        working-directory: frontend
        run: node scripts/check-csl-access.mjs
        env:
          DEMO_TEACHER_PASSWORD: ${{ secrets.RBAC_DEMO_TEACHER_PASSWORD }}
          RBAC_ALICE_ID: ${{ vars.RBAC_DEMO_ALICE_ID }}
      - name: Connect to AWS without stored access keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::516962256415:role/AssignmentHubGitHubFrontendDeploy
          aws-region: eu-west-2
      - name: Publish and verify frontend and teacher RBAC
        id: publish
        run: bash scripts/deployment/publish-verified-rbac.sh
        env:
          FRONTEND_DIST: frontend/dist
          DEMO_TEACHER_PASSWORD: ${{ secrets.RBAC_DEMO_TEACHER_PASSWORD }}
          RBAC_ALICE_ID: ${{ vars.RBAC_DEMO_ALICE_ID }}
          RBAC_REPORT_FILE: ${{ runner.temp }}/rbac-api-verification.json
          RBAC_SCREENSHOT_FILE: ${{ runner.temp }}/rbac-teacher-production.png
          RBAC_SNAPSHOT_DIR: ${{ runner.temp }}/rbac-rollback-snapshot
      - name: Save live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-rbac-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rbac-api-verification.json
            ${{ runner.temp }}/rbac-teacher-production.png
            ${{ runner.temp }}/rbac-rollback-snapshot/previous/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report deployment result
        if: always()
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Frontend deployment"
            echo "Commit: $DEPLOY_COMMIT"
            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "The public homepage, demo teacher API scope and browser login were verified."
            else
              echo "This run did not verify a completed live deployment. A successful build or push alone does not update the site."
              echo "Open the first failed step above for the error. If the frontend build succeeded, its recovery artifact is attached to this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
