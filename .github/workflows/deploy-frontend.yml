name: Deploy frontend to AWS
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/kjsea/**'
      - 'backend/src/submissions/**'
      - 'backend/src/labs/**'
      - 'backend/src/ai-content/**'
      - 'backend/src/ai/**'
      - 'backend/src/independent-students/**'
      - 'backend/src/payment/**'
      - 'backend/src/auth/**'
      - 'backend/src/lab-sessions/**'
      - 'backend/src/question-bank/**'
      - 'backend/src/mnemonic-cards/**'
      - 'backend/prisma/schema.prisma'
      - 'backend/prisma/migrations/**'
      - 'scripts/deployment/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-frontend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify learning activities
        run: npm run test:kjsea && npm run test:curriculum && npm run test:stem && npm run test:skills && npm run test:recall && npm run test:assignments && npm run test:revision
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://assignments-hub-api.onrender.com/api/v1
      - name: Save frontend build for deployment recovery
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Verify assessment backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://schema_check:unused@127.0.0.1:5432/schema_check
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm ci && npx prisma validate && npm test -- --runInBand src/kjsea src/submissions src/lab-sessions src/question-bank src/mnemonic-cards && npm test -- --runInBand src/ai-content src/ai/openai.service.spec.ts src/ai/ai-provider-router.service.spec.ts && npm test -- --runInBand src/independent-students src/payment src/auth && npm run build
      - name: Wait for assessment API capabilities
        working-directory: frontend
        run: node scripts/check-kjsea-api.mjs
      - name: Wait for immersive lab API and catalogue
        working-directory: frontend
        run: node scripts/check-stem-api.mjs
      - name: Wait for curriculum library API
        working-directory: frontend
        run: node scripts/check-curriculum-api.mjs
      - name: Wait for Tuma payment API and migration
        working-directory: frontend
        run: node scripts/check-tuma-api.mjs
      - name: Wait for username registration API
        working-directory: frontend
        run: node scripts/check-auth-api.mjs
      - name: Wait for central content library
        working-directory: frontend
        run: node scripts/check-content-api.mjs
      - name: Connect to AWS without stored access keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::516962256415:role/AssignmentHubGitHubFrontendDeploy
          aws-region: eu-west-2
      - name: Publish and verify frontend
        id: publish
        run: bash scripts/deployment/publish-frontend.sh
        env:
          FRONTEND_DIST: frontend/dist
      - name: Verify first-aid images
        run: npm run check:firstaid-assets -- https://assignmenthub.co.ke
        working-directory: frontend
      - name: Report deployment result
        if: always()
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Frontend deployment"
            echo "Commit: $DEPLOY_COMMIT"
            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "The public homepage was verified against this build after the CloudFront invalidation."
            else
              echo "This run did not verify a completed live deployment. A successful build or push alone does not update the site."
              echo "Open the first failed step above for the error. If the frontend build succeeded, its recovery artifact is attached to this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
