<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Attempt. Correct. Return.</title><desc id="desc">An illustrative spaced-practice routine, not a compulsory timetable Use the first incorrect step to choose the next practice task.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#17352e"/></marker></defs><rect width="1536" height="1024" fill="#fbfaf6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="72" y="90" font-size="24" fill="#5b7066" font-weight="700">ASSIGNMENT HUB · PARENT FIELD NOTES</text><rect x="72" y="119" width="90" height="8" rx="4" fill="#c5f235"/><text x="72" y="205" font-size="60" fill="#17352e" font-weight="700">Attempt. Correct. Return.</text><text x="72" y="265" font-size="29" fill="#5b7066" font-weight="500">An illustrative spaced-practice routine, not a compulsory timetable</text><rect x="72" y="370" width="325" height="350" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="96" y="395" width="277" height="70" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="127" y="444" font-size="32" fill="#c5f235" font-weight="700">DAY 1</text><text x="100" y="555" font-size="46" fill="#17352e" font-weight="700">Learn</text><text x="100" y="622" font-size="25" fill="#5b7066" font-weight="500">Use one example</text><rect x="427" y="370" width="325" height="350" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="451" y="395" width="277" height="70" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="482" y="444" font-size="32" fill="#c5f235" font-weight="700">DAY 2</text><text x="455" y="555" font-size="46" fill="#17352e" font-weight="700">Recall</text><text x="455" y="622" font-size="25" fill="#5b7066" font-weight="500">Try without notes</text><rect x="782" y="370" width="325" height="350" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="806" y="395" width="277" height="70" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="837" y="444" font-size="32" fill="#c5f235" font-weight="700">DAY 4</text><text x="810" y="555" font-size="46" fill="#17352e" font-weight="700">Mix</text><text x="810" y="622" font-size="25" fill="#5b7066" font-weight="500">Combine topics</text><rect x="1137" y="370" width="325" height="350" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="1161" y="395" width="277" height="70" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="1192" y="444" font-size="32" fill="#c5f235" font-weight="700">DAY 7</text><text x="1165" y="555" font-size="46" fill="#17352e" font-weight="700">Retry</text><text x="1165" y="622" font-size="25" fill="#5b7066" font-weight="500">Revisit an error</text><path d="M130 800 L1400 800" stroke="#17352e" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M72 907H1464" stroke="#d6dfd2" stroke-width="2"/><text x="72" y="960" font-size="27" fill="#5b7066" font-weight="500">Use the first incorrect step to choose the next practice task.</text></g></svg>