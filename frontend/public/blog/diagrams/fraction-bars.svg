<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Same whole. Equal value.</title><desc id="desc">One half, two quarters and four eighths represent the same amount Keep the whole consistent and explain the size of each part.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#17352e"/></marker></defs><rect width="1536" height="1024" fill="#fbfaf6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="72" y="90" font-size="24" fill="#5b7066" font-weight="700">ASSIGNMENT HUB · PARENT FIELD NOTES</text><rect x="72" y="119" width="90" height="8" rx="4" fill="#c5f235"/><text x="72" y="205" font-size="60" fill="#17352e" font-weight="700">Same whole. Equal value.</text><text x="72" y="265" font-size="29" fill="#5b7066" font-weight="500">One half, two quarters and four eighths represent the same amount</text><text x="72" y="406" font-size="42" fill="#17352e" font-weight="700">1/2</text><rect x="420" y="360" width="500" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="920" y="360" width="500" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><text x="72" y="536" font-size="42" fill="#17352e" font-weight="700">2/4</text><rect x="420" y="490" width="250" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="670" y="490" width="250" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="920" y="490" width="250" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><rect x="1170" y="490" width="250" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><text x="72" y="666" font-size="42" fill="#17352e" font-weight="700">4/8</text><rect x="420" y="620" width="125" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="545" y="620" width="125" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="670" y="620" width="125" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="795" y="620" width="125" height="75" fill="#c5f235" stroke="#17352e" stroke-width="3"/><rect x="920" y="620" width="125" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><rect x="1045" y="620" width="125" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><rect x="1170" y="620" width="125" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><rect x="1295" y="620" width="125" height="75" fill="#fff" stroke="#17352e" stroke-width="3"/><text x="420" y="815" font-size="42" fill="#17352e" font-weight="700">1/2 + 1/4 = 2/4 + 1/4 = 3/4</text><path d="M72 907H1464" stroke="#d6dfd2" stroke-width="2"/><text x="72" y="960" font-size="27" fill="#5b7066" font-weight="500">Keep the whole consistent and explain the size of each part.</text></g></svg>