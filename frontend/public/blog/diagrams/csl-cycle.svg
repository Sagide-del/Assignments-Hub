<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Five steps for a useful CSL project</title><desc id="desc">A real community need + safe action + honest reflection Confirm school requirements, consent, evidence and approval before acting.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#17352e"/></marker></defs><rect width="1536" height="1024" fill="#fbfaf6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="72" y="90" font-size="24" fill="#5b7066" font-weight="700">ASSIGNMENT HUB · PARENT FIELD NOTES</text><rect x="72" y="119" width="90" height="8" rx="4" fill="#c5f235"/><text x="72" y="205" font-size="60" fill="#17352e" font-weight="700">Five steps for a useful CSL project</text><text x="72" y="265" font-size="29" fill="#5b7066" font-weight="500">A real community need + safe action + honest reflection</text><rect x="72" y="375" width="258" height="330" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><circle cx="136" cy="440" r="35" fill="#c5f235"/><text x="125" y="452" font-size="30" fill="#17352e" font-weight="700">1</text><text x="96" y="535" font-size="32" fill="#17352e" font-weight="700">Need</text><text x="96" y="590" font-size="24" fill="#5b7066" font-weight="500">Listen and</text><text x="96" y="629" font-size="24" fill="#5b7066" font-weight="500">define the goal</text><rect x="354" y="375" width="258" height="330" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><circle cx="418" cy="440" r="35" fill="#c5f235"/><text x="407" y="452" font-size="30" fill="#17352e" font-weight="700">2</text><text x="378" y="535" font-size="32" fill="#17352e" font-weight="700">Approval</text><text x="378" y="590" font-size="24" fill="#5b7066" font-weight="500">Agree on safe</text><text x="378" y="629" font-size="24" fill="#5b7066" font-weight="500">supervision</text><rect x="636" y="375" width="258" height="330" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><circle cx="700" cy="440" r="35" fill="#c5f235"/><text x="689" y="452" font-size="30" fill="#17352e" font-weight="700">3</text><text x="660" y="535" font-size="32" fill="#17352e" font-weight="700">Action</text><text x="660" y="590" font-size="24" fill="#5b7066" font-weight="500">Do the planned</text><text x="660" y="629" font-size="24" fill="#5b7066" font-weight="500">activity</text><rect x="918" y="375" width="258" height="330" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><circle cx="982" cy="440" r="35" fill="#c5f235"/><text x="971" y="452" font-size="30" fill="#17352e" font-weight="700">4</text><text x="942" y="535" font-size="32" fill="#17352e" font-weight="700">Evidence</text><text x="942" y="590" font-size="24" fill="#5b7066" font-weight="500">Record your own</text><text x="942" y="629" font-size="24" fill="#5b7066" font-weight="500">contribution</text><rect x="1200" y="375" width="258" height="330" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><circle cx="1264" cy="440" r="35" fill="#c5f235"/><text x="1253" y="452" font-size="30" fill="#17352e" font-weight="700">5</text><text x="1224" y="535" font-size="32" fill="#17352e" font-weight="700">Reflection</text><text x="1224" y="590" font-size="24" fill="#5b7066" font-weight="500">Explain what</text><text x="1224" y="629" font-size="24" fill="#5b7066" font-weight="500">you would improve</text><path d="M72 907H1464" stroke="#d6dfd2" stroke-width="2"/><text x="72" y="960" font-size="27" fill="#5b7066" font-weight="500">Confirm school requirements, consent, evidence and approval before acting.</text></g></svg>