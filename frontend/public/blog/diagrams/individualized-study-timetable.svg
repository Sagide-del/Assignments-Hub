<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">A week built around learning</title><desc id="desc">Illustrative review intervals, not a compulsory schedule Adapt study blocks to school, home responsibilities, sleep and available time.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#17352e"/></marker></defs><rect width="1536" height="1024" fill="#fbfaf6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="72" y="90" font-size="24" fill="#5b7066" font-weight="700">ASSIGNMENT HUB · PARENT FIELD NOTES</text><rect x="72" y="119" width="90" height="8" rx="4" fill="#c5f235"/><text x="72" y="205" font-size="60" fill="#17352e" font-weight="700">A week built around learning</text><text x="72" y="265" font-size="29" fill="#5b7066" font-weight="500">Illustrative review intervals, not a compulsory schedule</text><rect x="72" y="355" width="325" height="460" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="92" y="375" width="285" height="75" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="117" y="425" font-size="35" fill="#c5f235" font-weight="700">MON</text><text x="98" y="525" font-size="25" fill="#5b7066" font-weight="500">Learn one idea</text><text x="98" y="565" font-size="25" fill="#5b7066" font-weight="500">Try an example</text><text x="98" y="605" font-size="25" fill="#5b7066" font-weight="500">Take a break</text><rect x="427" y="355" width="325" height="460" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="447" y="375" width="285" height="75" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="472" y="425" font-size="35" fill="#c5f235" font-weight="700">TUE</text><text x="453" y="525" font-size="25" fill="#5b7066" font-weight="500">Recall without notes</text><text x="453" y="565" font-size="25" fill="#5b7066" font-weight="500">Explain a correction</text><text x="453" y="605" font-size="25" fill="#5b7066" font-weight="500">Protect rest</text><rect x="782" y="355" width="325" height="460" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="802" y="375" width="285" height="75" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="827" y="425" font-size="35" fill="#c5f235" font-weight="700">THU</text><text x="808" y="525" font-size="25" fill="#5b7066" font-weight="500">Mix familiar topics</text><text x="808" y="565" font-size="25" fill="#5b7066" font-weight="500">Choose a method</text><text x="808" y="605" font-size="25" fill="#5b7066" font-weight="500">Ask why it fits</text><rect x="1137" y="355" width="325" height="460" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><rect x="1157" y="375" width="285" height="75" rx="26" fill="#17352e" stroke="#d6dfd2" stroke-width="2"/><text x="1182" y="425" font-size="35" fill="#c5f235" font-weight="700">SUN</text><text x="1163" y="525" font-size="25" fill="#5b7066" font-weight="500">Retry independently</text><text x="1163" y="565" font-size="25" fill="#5b7066" font-weight="500">Review the evidence</text><text x="1163" y="605" font-size="25" fill="#5b7066" font-weight="500">Plan the next week</text><path d="M72 907H1464" stroke="#d6dfd2" stroke-width="2"/><text x="72" y="960" font-size="27" fill="#5b7066" font-weight="500">Adapt study blocks to school, home responsibilities, sleep and available time.</text></g></svg>