<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Choose a route. Keep options open.</title><desc id="desc">A practical family decision, reviewed each term A combination code does not guarantee admission, placement or employment.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#17352e"/></marker></defs><rect width="1536" height="1024" fill="#fbfaf6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="72" y="90" font-size="24" fill="#5b7066" font-weight="700">ASSIGNMENT HUB · PARENT FIELD NOTES</text><rect x="72" y="119" width="90" height="8" rx="4" fill="#c5f235"/><text x="72" y="205" font-size="60" fill="#17352e" font-weight="700">Choose a route. Keep options open.</text><text x="72" y="265" font-size="29" fill="#5b7066" font-weight="500">A practical family decision, reviewed each term</text><rect x="72" y="365" width="325" height="420" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><text x="97" y="435" font-size="38" fill="#17352e" font-weight="700">01</text><text x="97" y="510" font-size="38" fill="#17352e" font-weight="700">Interests</text><text x="97" y="580" font-size="25" fill="#5b7066" font-weight="500">Show recent work</text><text x="97" y="620" font-size="25" fill="#5b7066" font-weight="500">Listen to the learner</text><text x="97" y="660" font-size="25" fill="#5b7066" font-weight="500">Discuss family hopes</text><rect x="427" y="365" width="325" height="420" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><text x="452" y="435" font-size="38" fill="#17352e" font-weight="700">02</text><text x="452" y="510" font-size="38" fill="#17352e" font-weight="700">Subjects</text><text x="452" y="580" font-size="25" fill="#5b7066" font-weight="500">Verify combinations</text><text x="452" y="620" font-size="25" fill="#5b7066" font-weight="500">Check prerequisites</text><t