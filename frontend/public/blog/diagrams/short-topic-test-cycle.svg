<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">A test should reveal the next step</title><desc id="desc">Focused practice + feedback + a later independent retry Three attempts is a workflow, not a promise of mastery or a universal learning rule.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#17352e"/></marker></defs><rect width="1536" height="1024" fill="#fbfaf6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="72" y="90" font-size="24" fill="#5b7066" font-weight="700">ASSIGNMENT HUB · PARENT FIELD NOTES</text><rect x="72" y="119" width="90" height="8" rx="4" fill="#c5f235"/><text x="72" y="205" font-size="60" fill="#17352e" font-weight="700">A test should reveal the next step</text><text x="72" y="265" font-size="29" fill="#5b7066" font-weight="500">Focused practice + feedback + a later independent retry</text><rect x="72" y="370" width="325" height="370" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><text x="97" y="445" font-size="41" fill="#17352e" font-weight="700">Attempt</text><text x="97" y="520" font-size="25" fill="#5b7066" font-weight="500">Close the notes</text><text x="97" y="560" font-size="25" fill="#5b7066" font-weight="500">Choose a method</text><text x="97" y="600" font-size="25" fill="#5b7066" font-weight="500">Explain the answer</text><rect x="427" y="370" width="325" height="370" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><text x="452" y="445" font-size="41" fill="#17352e" font-weight="700">Correct</text><text x="452" y="520" font-size="25" fill="#5b7066" font-weight="500">Locate the first error</text><text x="452" y="560" font-size="25" fill="#5b7066" font-weight="500">Write your reasoning</text><text x="452" y="600" font-size="25" fill="#5b7066" font-weight="500">Ask for support</text><rect x="782" y="370" width="325" height="370" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><text x="807" y="445" font-size="41" fill="#17352e" font-weight="700">Return</text><text x="807" y="520" font-size="25" fill="#5b7066" font-weight="500">Leave a useful gap</text><text x="807" y="560" font-size="25" fill="#5b7066" font-weight="500">Try a new example</text><text x="807" y="600" font-size="25" fill="#5b7066" font-weight="500">Check independence</text><rect x="1137" y="370" width="325" height="370" rx="26" fill="#fff" stroke="#d6dfd2" stroke-width="2"/><text x="1162" y="445" font-size="41" fill="#17352e" font-weight="700">Mix</text><text x="1162" y="520" font-size="25" fill="#5b7066" font-weight="500">Combine topics</text><text x="1162" y="560" font-size="25" fill="#5b7066" font-weight="500">Select the method</text><text x="1162" y="600" font-size="25" fill="#5b7066" font-weight="500">Practise pacing</text><path d="M72 907H1464" stroke="#d6dfd2" stroke-width="2"/><text x="72" y="960" font-size="27" fill="#5b7066" font-weight="500">Three attempts is a workflow, not a promise of mastery or a universal learning rule.</text></g></svg>