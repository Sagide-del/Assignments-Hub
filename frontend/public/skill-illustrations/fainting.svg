<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc"><title id="title">Feeling faint: help them rest safely</title><desc id="desc">Responsive person, no suspected injury. Stay nearby and get adult help.</desc><rect width="800" height="320" rx="24" fill="#f4f8f4"/><style>text{font-family:system-ui,sans-serif;fill:#15252b}.label{font-size:22px;font-weight:650}.small{font-size:18px;fill:#485e64}.line{stroke:#203940;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}</style><text x="32" y="44" class="label">Feeling faint: help them rest safely</text><path d="M52 231H510" stroke="#b0c9bc" stroke-width="5"/><rect x="323" y="174" width="120" height="53" rx="14" fill="#d2e9b0"/><circle cx="108" cy="190" r="24" fill="#b77b54"/><path d="M133 199L245 202L311 174L383 174" stroke="#2a6570" stroke-width="27" stroke-linecap="round" fill="none"/><path d="M146 207L219 216" class="line"/><path d="M245 213L310 189L384 188" stroke="#203940" stroke-width="12" stroke-linecap="round" fill="none"/><text x="58" y="105" class="label">Lie flat in a safe place</text><text x="279" y="144" class="small">Legs supported if safe</text><rect x="610" y="92" width="105" height="150" rx="18" fill="#14252c"/><rect x="621" y="111" width="83" height="95" rx="7" fill="#e4f4bf"/><path d="M642 145q12 28 37 35" class="line"/><circle cx="663" cy="224" r="6" fill="#b5e61d"/><text x="32" y="294" class="small">Responsive person, no suspected injury. Stay nearby and get adult help.</text></svg>
