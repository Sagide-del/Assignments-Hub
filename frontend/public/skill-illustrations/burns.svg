<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc"><title id="title">Thermal burn: cool running water</title><desc id="desc">No ice, butter or toothpaste. Keep the rest of the person warm. Get help.</desc><rect width="800" height="320" rx="24" fill="#f4f8f4"/><style>text{font-family:system-ui,sans-serif;fill:#15252b}.label{font-size:22px;font-weight:650}.small{font-size:18px;fill:#485e64}.line{stroke:#203940;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}</style><text x="32" y="44" class="label">Thermal burn: cool running water</text><path d="M168 102H289V130" class="line"/><path d="M182 81V104M165 81H200" class="line"/><path d="M279 146L268 190M294 146L289 195M308 146L312 190" stroke="#389bbd" stroke-width="5" stroke-linecap="round"/><path d="M128 222L401 222" stroke="#bc865e" stroke-width="38" stroke-linecap="round"/><circle cx="584" cy="173" r="73" fill="white" stroke="#558883" stroke-width="5"/><text x="545" y="174" style="font-size:40px;font-weight:750">20</text><text x="538" y="204" class="small">minutes</text><text x="414" y="78" class="label">Cool or lukewarm water</text><text x="32" y="294" class="small">No ice, butter or toothpaste. Keep the rest of the person warm. Get help.</text></svg>
